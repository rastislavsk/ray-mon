<!doctype html>
<html lang="sk">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- Testovacia verzia nového dizajnu „Živá obloha“, vyhľadávače ju nemajú ukazovať. -->
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#0b1130" />
        <meta name="description" content="RAY-MON v novom dizajne Živá obloha – testovacia verzia." />
        <title>RAY-MON obloha</title>
        <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
        <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="RAY-MON obloha" />
        <!-- Archivo je jediné písmo appky a na obrazovke je od prvej chvíle. crossorigin je pri
             písmach povinný, inak by ho prehliadač stiahol dvakrát. -->
        <link rel="preload" href="../fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="style.css" />
        <!-- Appku spúšťa boot.js: keď sa po nasadení zmiešajú staré a nové moduly z cache,
             stiahne ich znova a raz obnoví stránku. Žiadny iný modul appky sa tu nenačítava. -->
        <script type="module" src="boot.js"></script>
    </head>
    <body>
        <header class="st">
            <span id="hdr-place" class="place">RAY-MON</span>
            <span id="hdr-live" class="live" data-tone="off">
                <i aria-hidden="true"></i>
                <span id="hdr-status">načítavam…</span>
                <span id="hdr-tone" class="sr"></span>
            </span>
            <button type="button" id="hdr-setup" class="need hidden">Zadaj panely ›</button>
        </header>

        <main id="page" class="page">
            <!-- Karta Môžem?: texty a stav skladá render (web/render/mozem.js) z shared/mozem-sky.js,
                 tu sú len nosiče. Odpoveď je na oblohe pod oblúkom slnka, nadpis karty je len pre čítačku. -->
            <section id="panel-mozem" class="panel mozem" aria-labelledby="ttl-mozem">
                <h1 id="ttl-mozem" class="sr">Môžem?</h1>
                <div id="mz-arc" class="arc" aria-hidden="true"></div>
                <div id="mz-answer" class="big">
                    <div id="mz-chips" class="chips"></div>
                    <p id="mz-word" class="word"></p>
                    <p id="mz-lead" class="line"></p>
                </div>
                <p id="mz-phones" class="fact">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="6" y="2.5" width="12" height="19" rx="2.5" />
                        <path d="M10.5 18.5h3" />
                    </svg>
                    <span id="mz-phones-text"></span>
                </p>
                <button type="button" id="mz-retry" class="pbtn retry"></button>
                <div id="mz-guess" class="cta">
                    <b id="mz-guess-title"></b>
                    <p id="mz-guess-text"></p>
                    <button type="button" id="mz-guess-btn" class="pbtn"></button>
                </div>
                <div id="mz-ask" class="cta">
                    <b id="mz-ask-title"></b>
                    <p id="mz-ask-text"></p>
                    <button type="button" id="mz-ask-btn" class="pbtn"></button>
                </div>
                <section id="mz-list" class="glass" aria-labelledby="mz-list-title">
                    <h2 id="mz-list-title" class="glass-ttl"></h2>
                    <div id="mz-items" class="apps"></div>
                </section>
                <p id="mz-count" class="glass count"></p>
                <button type="button" id="mz-quip" class="quote"><q id="mz-quip-text"></q><small id="mz-quip-hint"></small></button>
            </section>
            <!-- Karta Teraz: texty, graf aj pás odporúčaní skladá render (web/render/teraz.js)
                 z shared/teraz.js, tu sú len nosiče. Graf je zároveň posúvač času: prst, kurzor
                 aj šípky na ňom ukážu iný čas (náhľad). -->
            <section id="panel-terazky" class="panel teraz hidden" aria-labelledby="ttl-terazky">
                <h1 id="ttl-terazky" class="ttl">Teraz</h1>
                <p id="tz-num" class="knum"><span id="tz-num-val"></span><small>kW</small></p>
                <p id="tz-src" class="src"></p>
                <p id="tz-sub" class="sub"></p>
                <button type="button" id="tz-retry" class="pbtn retry"></button>
                <div id="tz-guess" class="cta">
                    <b id="tz-guess-title"></b>
                    <p id="tz-guess-text"></p>
                    <button type="button" id="tz-guess-btn" class="pbtn"></button>
                </div>
                <div id="tz-ask" class="cta">
                    <b id="tz-ask-title"></b>
                    <p id="tz-ask-text"></p>
                    <button type="button" id="tz-ask-btn" class="pbtn"></button>
                </div>
                <div id="tz-plot">
                    <div
                        id="tz-chart"
                        class="glass day-scrub"
                        role="slider"
                        tabindex="0"
                        aria-valuemin="0"
                        aria-valuemax="1425"
                        aria-describedby="tz-chart-desc"
                    ></div>
                    <p id="tz-chart-desc" class="sr"></p>
                    <p id="tz-legend" class="legend"></p>
                    <div class="hint">
                        <span id="tz-hint"></span>
                        <button type="button" id="tz-reset" class="hint-btn"></button>
                    </div>
                </div>
                <div id="tz-recs">
                    <div id="tz-strip" class="strip" role="group" tabindex="0">
                        <div class="glass rec">
                            <b id="tz-now-head" class="h"></b>
                            <p id="tz-now-body"></p>
                        </div>
                        <div class="glass rec">
                            <h2 id="tz-devices-title" class="glass-ttl"></h2>
                            <p id="tz-devices"></p>
                        </div>
                        <div class="glass rec">
                            <h2 id="tz-today-title" class="glass-ttl"></h2>
                            <p id="tz-today"></p>
                            <div class="bar" aria-hidden="true"><i id="tz-today-bar"></i></div>
                            <p id="tz-window"></p>
                        </div>
                        <div class="glass rec">
                            <h2 id="tz-later-title" class="glass-ttl"></h2>
                            <p id="tz-later"></p>
                        </div>
                    </div>
                    <div id="tz-dots" class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                </div>
            </section>
            <!-- Karta 7 dní: prehľad dní ako predpoveď počasia a dva detaily (deň, týždeň). Texty, riadky
                 aj grafy skladá render (web/render/sedem.js) z shared/sedem-dni.js, tu sú len nosiče.
                 Nadpis karty je len pre čítačku, na oblohe je otázka s najlepším dňom. -->
            <section id="panel-7dni" class="panel sedem hidden" aria-labelledby="ttl-7dni">
                <h1 id="ttl-7dni" class="sr">7 dní</h1>
                <div id="sd-list">
                    <h2 id="sd-title" class="ttl"></h2>
                    <button type="button" id="sd-sum" class="sumbtn">
                        <span id="sd-sum-text"></span>
                        <span aria-hidden="true">›</span>
                    </button>
                    <p id="sd-sub" class="sub"></p>
                    <button type="button" id="sd-retry" class="pbtn retry"></button>
                    <div id="sd-ask" class="cta">
                        <b id="sd-ask-title"></b>
                        <p id="sd-ask-text"></p>
                        <button type="button" id="sd-ask-btn" class="pbtn"></button>
                    </div>
                    <div id="sd-guess" class="cta">
                        <b id="sd-guess-title"></b>
                        <p id="sd-guess-text"></p>
                        <button type="button" id="sd-guess-btn" class="pbtn"></button>
                    </div>
                    <div id="sd-days" class="days"></div>
                    <p id="sd-hint" class="sub note"></p>
                </div>
                <div id="sd-day" class="hidden">
                    <button type="button" id="sd-day-back" class="back">
                        <span aria-hidden="true">‹</span><span class="sr">Späť na </span><span id="sd-day-back-text"></span>
                    </button>
                    <h2 class="ttl dttl"><span id="sd-day-title"></span><span id="sd-day-icon"></span></h2>
                    <p id="sd-day-sub" class="sub"></p>
                    <div id="sd-day-nums" class="nums"></div>
                    <div id="sd-day-chart" class="glass dchart" role="img"></div>
                    <p id="sd-day-legend" class="legend"></p>
                    <div id="sd-day-facts" class="glass facts">
                        <p id="sd-day-done"></p>
                        <p id="sd-day-clear"></p>
                        <p id="sd-day-price"></p>
                    </div>
                    <div class="glass msg">
                        <h3 id="sd-day-msg-title"></h3>
                        <p id="sd-day-msg-body"></p>
                    </div>
                    <p id="sd-day-hint" class="sub note"></p>
                </div>
                <div id="sd-week" class="hidden">
                    <button type="button" id="sd-week-back" class="back">
                        <span aria-hidden="true">‹</span><span class="sr">Späť na </span><span id="sd-week-back-text"></span>
                    </button>
                    <h2 id="sd-week-title" class="ttl"></h2>
                    <p id="sd-week-range" class="sub"></p>
                    <div id="sd-week-nums" class="nums"></div>
                    <section class="glass" aria-labelledby="sd-bars-title">
                        <h3 id="sd-bars-title" class="glass-ttl"></h3>
                        <div id="sd-bars" class="chartbox" role="img"></div>
                    </section>
                    <section class="glass" aria-labelledby="sd-heat-title">
                        <h3 id="sd-heat-title" class="glass-ttl"></h3>
                        <div id="sd-heat" class="chartbox" role="img"></div>
                        <p id="sd-heat-note" class="note"></p>
                    </section>
                    <div class="glass msg">
                        <h3 id="sd-week-msg-title"></h3>
                        <p id="sd-week-msg-body"></p>
                    </div>
                    <p id="sd-week-hint" class="sub note"></p>
                </div>
            </section>
            <section id="panel-statistika" class="panel hidden" aria-labelledby="ttl-statistika">
                <h1 id="ttl-statistika" class="ttl">Štatistika</h1>
                <p class="sub">Táto karta príde v ďalšom kroku.</p>
            </section>
            <section id="panel-nastavenie" class="panel hidden" aria-labelledby="ttl-nastavenie">
                <h1 id="ttl-nastavenie" class="ttl">Nastavenie</h1>
                <p class="sub">Táto karta príde v ďalšom kroku.</p>
            </section>
        </main>

        <nav class="tabs" aria-label="Karty appky">
            <button type="button" id="nav-mozem" data-panel="mozem">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M8 12.5l2.8 2.8L16.5 9.5" />
                </svg>
                <span>Môžem?</span>
            </button>
            <button type="button" id="nav-terazky" data-panel="terazky">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" /></svg>
                <span>Teraz</span>
            </button>
            <button type="button" id="nav-7dni" data-panel="7dni">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="3" />
                    <path d="M3 10h18M8 3v4M16 3v4" />
                </svg>
                <span>7 dní</span>
            </button>
            <button type="button" id="nav-statistika" data-panel="statistika">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9" /></svg>
                <span>Štatistika</span>
            </button>
            <button type="button" id="nav-nastavenie" data-panel="nastavenie">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                    />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <span>Nastavenie</span>
            </button>
        </nav>

        <!-- Panel veci karty Môžem? zospodu. Otvára sa ako modálny dialóg: čítačka ho ohlási,
             fokus ostane v ňom a Escape ho zatvorí. -->
        <dialog id="mz-sheet" class="sheet" aria-labelledby="mz-sheet-title">
            <div class="sheet-in">
                <button type="button" id="mz-sheet-x" class="x"><span aria-hidden="true">×</span></button>
                <h2 id="mz-sheet-title"></h2>
                <h3 id="mz-sheet-do-q" class="q"></h3>
                <p id="mz-sheet-do"></p>
                <h3 id="mz-sheet-why-q" class="q"></h3>
                <p id="mz-sheet-why"></p>
                <h3 id="mz-sheet-more-q" class="q"></h3>
                <p id="mz-sheet-more"></p>
                <button type="button" id="mz-sheet-log" class="pbtn"></button>
            </div>
        </dialog>
    </body>
</html>
