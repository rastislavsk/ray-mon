<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 2 84 84" width="96" height="96">
    <!-- Odznak oznámenia (sw.js): Android berie len tvar, preto biela na priehľadnom.
         Zjednodušený favicon.svg: hrubšie lúče, bez čiar panelov - pri 24 dp by zanikli.
         PNG z neho: vyrenderovať v Chromiu 96 × 96 s priehľadným pozadím. -->
    <mask id="m">
        <rect x="0" y="0" width="100" height="100" fill="#fff" />
        <!-- medzera medzi slnkom a strechou, dvere -->
