    </mask>
    <g mask="url(#m)" fill="#fff" stroke="#fff" stroke-width="5" stroke-linecap="round">
        <line x1="70" y1="7" x2="70" y2="13" />
        <line x1="90" y1="27" x2="84" y2="27" />
        <line x1="84" y1="13" x2="80" y2="17" />
        <line x1="56" y1="13" x2="60" y2="17" />
        <circle cx="70" cy="27" r="10" stroke="none" />
    </g>
    <mask id="d">
        <rect x="0" y="0" width="100" height="100" fill="#fff" />
        <rect x="42" y="61" width="16" height="20" fill="#000" />
