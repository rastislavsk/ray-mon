name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Actions sú pripnuté na hash commitu, nie na značku: značku vie jej autor (alebo útočník s jeho
    # prístupom) presunúť na iný kód. Verzia je v komentári, hash aj komentár posúva Dependabot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Worker bundle dry-run
        working-directory: worker
        run: npm ci && npx wrangler deploy --dry-run --outdir dist
      - name: Playwright browsers
        # --with-deps spúšťa apt-get update, a ten skončí chybou, keď je pokazený ktorýkoľvek
        # zdroj balíkov - aj taký, z ktorého tento build nič nepotrebuje. Google Chrome repo
        # z obrazu runnera už raz servírovalo Packages.gz s nesediacim hashom a zhodilo tým
        # CI na každom PR. Chromium si sťahuje Playwright sám, systémové knižnice sú
        # v Ubuntu zdrojoch, takže tento zdroj môže ísť preč.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
