# Cloudflare Worker "ray-mon": živé meranie z kiosku, ktorý si zadal
# používateľ appky (POST /pv). Nasadenie: pozri worker/README.md.
# Meno musí sedieť s Workerom v Cloudflare účte, inak by wrangler nasadil do iného Workera
# a appka by volala starú verziu.
name = "ray-mon"
main = "src/index.js"
compatibility_date = "2026-08-29"

# Uchovávanie logov, aby sa dala dohľadať príčina zlyhania spätne, nielen v živom výpise.
[observability]
enabled = true

# Odbery ranného oznámenia: adresa, kam telefón zobudiť, hodina a časové pásmo
# (worker/src/oznamenia.js). Nič iné Worker neukladá.
[[kv_namespaces]]
binding = "ODBERY"
id = "51a2f040218742d2addba28299417769"

# Budenie ranných oznámení a pripomienok každú štvrťhodinu (OZNAMENIA.stepMin v shared/config.js).
[triggers]
crons = ["*/15 * * * *"]

# Obmedzenie počtu volaní z jednej adresy na cestách, ktoré sa dajú zneužiť (pripojenie, zdieľanie,
# odbery; CESTY vo worker/src/index.js). Počíta sa zvlášť pre cestu a adresu, v každom mieste Cloudflare.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Účty Huawei Northbound (worker/src/ucet.js): telefón aj zásuvka s bojlerom merajú cez jeden objekt
# na účet, aby sa navzájom neodhlasovali a nepreťažili limit Huawei. Len SQLite (bezplatný plán).
[[durable_objects.bindings]]
name = "UCTY"
class_name = "UcetHuawei"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UcetHuawei"]

# Budíky konca programu (worker/src/budik.js, docs/navrhy/spotrebic-koniec-opakovanie.html): jeden objekt na odber
# telefónu, alarmom pošle oznámenie presne v čase konca. Len SQLite (bezplatný plán).
[[durable_objects.bindings]]
name = "BUDIK"
class_name = "Budik"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Budik"]
