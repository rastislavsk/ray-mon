# Cloudflare Worker "ray-mon": živé meranie z kiosku, ktorý si zadal
# používateľ appky (POST /pv). Nasadenie: pozri worker/README.md.
# Meno musí sedieť s Workerom v Cloudflare účte, inak by wrangler nasadil do iného Workera
# a appka by volala starú verziu.
name = "ray-mon"
main = "src/index.js"
compatibility_date = "2026-08-29"

# Uchovávanie logov, aby sa dala dohľadať príčina zlyhania spätne, nielen v živom výpise.
[observability]
enabled = true
